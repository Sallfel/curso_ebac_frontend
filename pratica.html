<!DOCTYPE html>
	<html lang="pt-br">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=0">
		<title>Pratica_html</title>
		</head>
	<body>
		<header>
			<h1>Formulário de Cadastro</h1>
		</header>
			<h3>Preencha com seus dados para se cadastrar.</h3> <br>
		<form>
			<label for="nome">Nome:</label><br>
			<input type="text" id="nome" placeholder="Digite seu nome" name="Nome" required> <br>
			<label for="email">E-mail:</label><br>
			<input type="email" id="email" placeholder="E-mail" name="email" required> <br>
			<label for="senha">Senha:</label> <br>
			<input type="password" id="Senha" placeholder="Senha" name="Senha" required> <br>
			<br>
			<button type="submit">Cadastrar</button> <button type="reset">Limpar</button>
 		</form>
	</body>
	</html>
